<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">
      <span class="material-icons logo-icon">local_shipping</span>
    </div>
    <h2 class="logo-text">ParcelConnect</h2>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar">
      <span class="material-icons">person</span>
    </div>
    <div class="user-info">
      <p class="user-greeting label-sm">Welcome back</p>
      <p class="user-type title-sm">{{ userName }}</p>
    </div>
  </div>

  <!-- Mode Switcher -->
  <div class="mode-switcher">
    <a routerLink="/dashboard/sender"
       class="mode-btn"
       [class.active]="userType === 'sender'">
      <span class="material-icons">inventory_2</span>
      Sender
    </a>
    <a routerLink="/dashboard/traveller"
       class="mode-btn"
       [class.active]="userType === 'traveller'">
      <span class="material-icons">flight</span>
      Traveller
    </a>
  </div>

  <nav class="sidebar-nav">
    <p class="nav-section-label label-sm">
      {{ userType === 'sender' ? 'SENDER MENU' : 'TRAVELLER MENU' }}
    </p>
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <span class="material-icons nav-icon">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a (click)="logout()" class="nav-link nav-link-logout">
      <span class="material-icons nav-icon">logout</span>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</aside>
