<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <div class="logo-mark">
      <span class="material-icons logo-icon">local_shipping</span>
    </div>
    <h2 class="logo-text">Zippora</h2>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar">
      <span class="material-icons">person</span>
    </div>
    <div class="user-info">
      <p class="user-greeting label-sm">Welcome back</p>
      <p class="user-type title-sm">{{ userName }}</p>
      <span class="chip chip-primary" style="margin-top: 0.25rem">{{ roleLabel }}</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <p class="nav-section-label label-sm">{{ roleLabel | uppercase }} MENU</p>
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="onNavClick()"
      >
        <span class="material-icons nav-icon">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a (click)="onNavClick(); logout()" class="nav-link nav-link-logout">
      <span class="material-icons nav-icon">logout</span>
      <span class="nav-label">Logout</span>
    </a>
  </div>
</aside>
