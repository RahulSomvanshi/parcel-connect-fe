<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">
      <span class="material-icons logo-icon">local_shipping</span>
    </div>
    <h2 class="logo-text">KineticLink</h2>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar">
      <span class="material-icons">person</span>
    </div>
    <div class="user-info">
      <p class="user-greeting label-sm">Welcome back</p>
      <p class="user-type title-sm">{{ userType === 'sender' ? 'Sender' : 'Traveller' }} Account</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <span class="material-icons nav-icon">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/dashboard/sender" class="nav-link" [class.active]="userType === 'sender'">
      <span class="material-icons nav-icon">person</span>
      <span class="nav-label">Sender Mode</span>
    </a>
    <a routerLink="/dashboard/traveller" class="nav-link" [class.active]="userType === 'traveller'">
      <span class="material-icons nav-icon">flight</span>
      <span class="nav-label">Traveller Mode</span>
    </a>
    <a routerLink="/login" class="nav-link nav-link-settings">
      <span class="material-icons nav-icon">settings</span>
      <span class="nav-label">Settings</span>
    </a>
  </div>
</aside>
