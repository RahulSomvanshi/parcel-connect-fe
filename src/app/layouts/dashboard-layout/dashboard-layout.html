<div class="dashboard-shell">
  <div
    class="sidebar-overlay"
    [class.active]="sidebarOpen"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>
  <app-sidebar [isOpen]="sidebarOpen" (menuClose)="closeSidebar()" />
  <div class="dashboard-main">
    <app-top-nav [breadcrumbs]="breadcrumbs" (menuToggle)="toggleSidebar()" />
    <main class="dashboard-content">
      <router-outlet />
    </main>
  </div>
  <app-bottom-nav />
</div>
